name: Secret Scan (gitleaks)

# Gate de segurança do PHF-081: nenhuma credencial pode entrar no código/repositório.
# Roda SEMPRE (sem guard de scaffold): docs, config de CI e workflows também podem vazar segredo.
# Falha o PR se encontrar segredo no diff, na árvore de arquivos ou no histórico de commits.

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth: 0 permite ao gitleaks varrer todo o histórico, não só a árvore atual —
          # um segredo commitado e depois removido continua exposto no histórico e precisa ser pego.
          fetch-depth: 0

      # Instala o binário oficial (MIT) direto do release em vez de gitleaks/gitleaks-action,
      # porque o Action exige GITLEAKS_LICENSE para contas de organização (Condor-Martech é org).
      - name: Instalar gitleaks
        env:
          GITLEAKS_VERSION: 8.18.4
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks version

      - name: Varredura de segredos
        run: |
          /tmp/gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --verbose \
            --exit-code 1
