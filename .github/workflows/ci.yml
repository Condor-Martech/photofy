name: CI

on:
  pull_request:
    branches: [staging, main]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # package.json ainda não existe (scaffold do projeto vem em PR separado, PHF-020/PHF-010).
      # Guard por hashFiles evita falso-vermelho até o scaffold ser mergeado na base branch;
      # remover o guard quando package-lock.json estiver em staging/main.
      - uses: actions/setup-node@v4
        if: hashFiles('package-lock.json') != ''
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: hashFiles('package-lock.json') != ''
        run: npm ci

      - name: Lint
        if: hashFiles('package-lock.json') != ''
        run: npm run lint --if-present

      - name: Test
        if: hashFiles('package-lock.json') != ''
        run: npm test --if-present

      - name: Build
        if: hashFiles('package-lock.json') != ''
        run: npm run build --if-present

      # Verifica que o Dockerfile builda (sem push) antes do merge -- o publish de verdade
      # (com push para GHCR) roda em docker-publish.yml, so em push para staging/main.
      - uses: docker/setup-buildx-action@v3
        if: hashFiles('package-lock.json') != ''

      - name: Docker build (verificação, sem push)
        if: hashFiles('package-lock.json') != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
