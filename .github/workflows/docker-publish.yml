name: Docker Publish (GHCR)

on:
  push:
    branches: [staging, main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set image tags
        id: vars
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(git rev-parse --short HEAD)
          BRANCH_TAG="${{ github.ref_name }}"
          echo "repo_lower=$REPO_LOWER" >> "$GITHUB_OUTPUT"
          echo "branch_tag=$BRANCH_TAG" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${BRANCH_TAG}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.repo_lower }}:${{ steps.vars.outputs.branch_tag }}
            ghcr.io/${{ steps.vars.outputs.repo_lower }}:${{ steps.vars.outputs.sha_tag }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Build & push orchestrator
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./workers/orchestrator/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.repo_lower }}/orchestrator:${{ steps.vars.outputs.branch_tag }}
            ghcr.io/${{ steps.vars.outputs.repo_lower }}/orchestrator:${{ steps.vars.outputs.sha_tag }}
          cache-from: type=gha,scope=orchestrator
          cache-to: type=gha,mode=max,scope=orchestrator
