name: Docker Publish (GHCR)

on:
  push:
    branches: [staging, main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Guard: so builda/publica de verdade quando o scaffold da aplicacao (PHF-010/020,
    # com package-lock.json e next.config.js output:'standalone') estiver na base branch.
    # Ate la o job roda e nao faz nada, em vez de ficar vermelho por falta de Dockerfile funcional.
    steps:
      - uses: actions/checkout@v4

      - name: Set image tags
        id: vars
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(git rev-parse --short HEAD)
          BRANCH_TAG="${{ github.ref_name }}"
          echo "repo_lower=$REPO_LOWER" >> "$GITHUB_OUTPUT"
          echo "branch_tag=$BRANCH_TAG" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${BRANCH_TAG}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        if: hashFiles('package-lock.json') != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3
        if: hashFiles('package-lock.json') != ''

      - uses: docker/build-push-action@v6
        if: hashFiles('package-lock.json') != ''
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.repo_lower }}:${{ steps.vars.outputs.branch_tag }}
            ghcr.io/${{ steps.vars.outputs.repo_lower }}:${{ steps.vars.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
