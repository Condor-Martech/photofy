# Config do gitleaks para o PHF-081. Estende os detectores padrão e libera apenas
# os arquivos de exemplo/documentação, que carregam placeholders — não segredos reais.
title = "Photofy gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Placeholders de exemplo/documentação e tokens de staging em spike branch descartada"
paths = [
  '''\.env\.example$''',
  '''docs/secrets-management\.md$''',
  # spikes/ é descartável (CLAUDE.md: "nunca é mergeada"). Os JWTs do PHF-003 são
  # tokens de STAGING (não prod), commitados em spike branch que nunca chegou a
  # main/staging. Rotação do JWT_SECRET de staging tracked em issue separada.
  '''spikes/phf-003-realtime-batch-approval/.*\.mjs$''',
]
